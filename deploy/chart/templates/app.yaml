{{- $root := . -}}
{{- $phase := .Values.blueGreen.phase -}}
{{- $activeSlot := .Values.blueGreen.activeSlot -}}
{{- if not (has $phase (list "migration" "coexist" "active")) -}}
{{- fail "blueGreen.phase must be migration, coexist, or active" -}}
{{- end -}}
{{- if not (has $activeSlot (list "blue" "green")) -}}
{{- fail "blueGreen.activeSlot must be either blue or green" -}}
{{- end -}}
{{- range $requiredSlot := list "blue" "green" -}}
{{- if not (hasKey $root.Values.blueGreen.slots $requiredSlot) -}}
{{- fail (printf "blueGreen.slots.%s is required" $requiredSlot) -}}
{{- end -}}
{{- end -}}
{{- range $slot := keys $root.Values.blueGreen.slots -}}
{{- if not (has $slot (list "blue" "green")) -}}
{{- fail (printf "unsupported blueGreen slot: %s" $slot) -}}
{{- end -}}
{{- end -}}
{{- range $name := list "backend" "frontend" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "portal.labels" $root | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    {{- if eq $phase "coexist" }}
    app.kubernetes.io/slot: blue
    {{- else if eq $phase "active" }}
    app.kubernetes.io/slot: {{ $activeSlot }}
    {{- end }}
  ports:
    - name: http
      port: {{ if eq $name "backend" }}8000{{ else }}80{{ end }}
{{- end }}

{{- if ne $phase "migration" }}
{{- range $slot := list "blue" "green" }}
{{ include "portal.frontendConfigMap" (dict "root" $root "slot" $slot) }}
{{- end }}
{{- end }}

{{- if eq $phase "migration" }}
---
{{ include "portal.backendDeployment" (dict "root" $root "name" "backend" "slot" "blue" "backendTag" $root.Values.images.backend.tag "frontendTag" $root.Values.images.frontend.tag "legacy" true) }}
---
{{ include "portal.frontendDeployment" (dict "root" $root "name" "frontend" "slot" "blue" "backendTag" $root.Values.images.backend.tag "frontendTag" $root.Values.images.frontend.tag "legacy" true) }}
{{- else }}
  {{- if eq $phase "coexist" }}
---
{{ include "portal.backendDeployment" (dict "root" $root "name" "backend" "slot" "blue" "backendTag" $root.Values.images.backend.tag "frontendTag" $root.Values.images.frontend.tag "legacy" true) }}
---
{{ include "portal.frontendDeployment" (dict "root" $root "name" "frontend" "slot" "blue" "backendTag" $root.Values.images.backend.tag "frontendTag" $root.Values.images.frontend.tag "legacy" true) }}
  {{- end }}
  {{- range $slot := list "blue" "green" }}
  {{- $slotConfig := index $root.Values.blueGreen.slots $slot }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-{{ $slot }}
  labels:
    {{- include "portal.labels" $root | nindent 4 }}
    app.kubernetes.io/slot: {{ $slot }}
spec:
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/slot: {{ $slot }}
  ports:
    - name: http
      port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-{{ $slot }}
  labels:
    {{- include "portal.labels" $root | nindent 4 }}
    app.kubernetes.io/slot: {{ $slot }}
spec:
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/slot: {{ $slot }}
  ports:
    - name: http
      port: 80
---
{{ include "portal.backendDeployment" (dict "root" $root "name" (printf "backend-%s" $slot) "slot" $slot "backendTag" $slotConfig.backendTag "frontendTag" $slotConfig.frontendTag "legacy" false) }}
---
{{ include "portal.frontendDeployment" (dict "root" $root "name" (printf "frontend-%s" $slot) "slot" $slot "backendTag" $slotConfig.backendTag "frontendTag" $slotConfig.frontendTag "legacy" false) }}
  {{- end }}
{{- end }}
