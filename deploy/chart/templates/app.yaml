apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/secrets: {{ toJson .Values.secrets | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          env:
            - {name: REDMINE_BASE_URL, value: "http://redmine:3000"}
            - name: REDMINE_API_KEY
              valueFrom:
                secretKeyRef: {name: support-ticket-portal-secrets, key: REDMINE_API_KEY}
            - {name: REDMINE_PROJECT_ID, value: {{ .Values.app.redmineProjectId | quote }}}
            - {name: REDMINE_TRACKER_ID, value: {{ .Values.app.redmineTrackerId | quote }}}
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: SESSION_COOKIE_SECURE, value: {{ .Values.app.sessionCookieSecure | quote }}}
            - {name: CORS_ORIGINS, value: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) (include "portal.host" .) | quote }}}
            {{- if .Values.observability.tempoEnabled }}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "tempo:4317"}
            {{- else }}
            - {name: OTEL_SDK_DISABLED, value: "true"}
            {{- end }}
            {{- range $name, $value := .Values.app.backendEnv }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.resources.backend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources: {{ toYaml .Values.resources.frontend | nindent 12 }}
