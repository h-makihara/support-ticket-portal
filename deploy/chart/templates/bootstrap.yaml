apiVersion: v1
kind: ConfigMap
metadata:
  name: redmine-bootstrap
  labels:
    {{- include "portal.labels" . | nindent 4 }}
data:
  bootstrap_redmine.rb: |
{{ .Files.Get "files/bootstrap_redmine.rb" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redmine-bootstrap
  labels:
    {{- include "portal.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redmine-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: "{{ .Values.images.redmine.repository }}:{{ .Values.images.redmine.tag }}"
          imagePullPolicy: {{ .Values.images.redmine.pullPolicy }}
          # Keep the image ENTRYPOINT so it generates config/database.yml from
          # the REDMINE_DB_* environment variables before running the script.
          args: ["bundle", "exec", "rails", "runner", "/bootstrap/bootstrap_redmine.rb"]
          env:
            - {name: REDMINE_DB_POSTGRES, value: postgres}
            - {name: REDMINE_DB_USER, value: postgres}
            - {name: REDMINE_DB_DATABASE, value: redmine}
            - name: REDMINE_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: support-ticket-portal-secrets, key: POSTGRES_PASSWORD}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef: {name: support-ticket-portal-secrets, key: REDMINE_SECRET_KEY_BASE}
            - name: REDMINE_API_KEY
              valueFrom:
                secretKeyRef: {name: support-ticket-portal-secrets, key: REDMINE_API_KEY}
            - {name: REDMINE_PROJECT_ID, value: {{ .Values.app.redmineProjectId | quote }}}
            - {name: REDMINE_PROJECT_IDENTIFIER, value: {{ .Values.app.redmineProjectIdentifier | quote }}}
            - {name: ENABLE_TEST_USERS, value: {{ .Values.app.testUsers.enabled | quote }}}
            - {name: TEST_ADMIN_USERNAME, value: {{ include "portal.testUsername" (dict "root" . "role" "admin") | quote }}}
            - {name: TEST_ADMIN_EMAIL, value: {{ include "portal.testEmail" (dict "root" . "role" "admin") | quote }}}
            - name: TEST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: support-ticket-portal-secrets, key: TEST_ADMIN_PASSWORD}
            - {name: TEST_SUPPORT_USERNAME, value: {{ include "portal.testUsername" (dict "root" . "role" "support") | quote }}}
            - {name: TEST_SUPPORT_EMAIL, value: {{ include "portal.testEmail" (dict "root" . "role" "support") | quote }}}
            - name: TEST_SUPPORT_PASSWORD
              valueFrom:
                secretKeyRef: {name: support-ticket-portal-secrets, key: TEST_SUPPORT_PASSWORD}
            - {name: TEST_SALES_USERNAME, value: {{ include "portal.testUsername" (dict "root" . "role" "sales") | quote }}}
            - {name: TEST_SALES_EMAIL, value: {{ include "portal.testEmail" (dict "root" . "role" "sales") | quote }}}
            - name: TEST_SALES_PASSWORD
              valueFrom:
                secretKeyRef: {name: support-ticket-portal-secrets, key: TEST_SALES_PASSWORD}
          volumeMounts:
            - {name: bootstrap, mountPath: /bootstrap}
      volumes:
        - name: bootstrap
          configMap:
            name: redmine-bootstrap
