{{- define "portal.frontendConfig" -}}
{{- $slot := .slot -}}
server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend-{{ $slot }}:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }
}
{{- end }}

{{- if ne .Values.blueGreen.phase "migration" }}
{{- range $slot := list "blue" "green" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-{{ $slot }}-nginx
  labels:
    {{- include "portal.labels" $ | nindent 4 }}
    app.kubernetes.io/slot: {{ $slot }}
data:
  default.conf: |
{{ include "portal.frontendConfig" (dict "slot" $slot) | indent 4 }}
{{- end }}
{{- end }}
