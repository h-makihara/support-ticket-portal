{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-ticket-portal
  labels:
    {{- include "portal.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ include "portal.host" . | quote }}]
      secretName: {{ required "ingress.tls.secretName is required when TLS is enabled" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ include "portal.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {name: http}
{{- end }}
{{- if .Values.redmineIngress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redmine
  labels:
    {{- include "portal.labels" . | nindent 4 }}
  {{- with .Values.redmineIngress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.redmineIngress.className }}
  {{- if .Values.redmineIngress.tls.enabled }}
  tls:
    - hosts: [{{ include "portal.redmineHost" . | quote }}]
      secretName: {{ required "redmineIngress.tls.secretName is required when TLS is enabled" .Values.redmineIngress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ include "portal.redmineHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redmine
                port: {name: http}
{{- end }}
