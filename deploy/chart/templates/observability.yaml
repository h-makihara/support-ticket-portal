{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-otel-collector-config
  labels:
    {{- include "portal.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
      filter/backend_logs:
        error_mode: ignore
        logs:
          log_record:
            # The filter processor drops matching records: retain INFO+ and
            # retain lower-severity records only when the boolean flag is true.
            - 'severity_number < 9 and attributes[{{ .Values.observability.debugLogFlagAttribute | quote }}] != true'
      batch: {}

    exporters:
      otlphttp/alloy:
        endpoint: http://alloy:4318

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, filter/backend_logs, batch]
          exporters: [otlphttp/alloy]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/alloy]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/alloy]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    {{- include "portal.labels" . | nindent 4 }}
data:
  config.alloy: |
    otelcol.receiver.otlp "gateway" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        logs    = [otelcol.processor.batch.gateway.input]
        metrics = [otelcol.processor.batch.gateway.input]
        traces  = [otelcol.processor.batch.gateway.input]
      }
    }

    otelcol.processor.batch "gateway" {
      output {
        logs    = [otelcol.exporter.otlphttp.external.input]
        metrics = [otelcol.exporter.otlphttp.external.input]
        traces  = [otelcol.exporter.otlphttp.external.input]
      }
    }

    otelcol.exporter.otlphttp "external" {
      client {
        endpoint = {{ required "observability.externalOtlpEndpoint is required" .Values.observability.externalOtlpEndpoint | quote }}
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ toJson .Values.observability | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: alloy
          image: "{{ .Values.images.alloy.repository }}:{{ .Values.images.alloy.tag }}"
          imagePullPolicy: {{ .Values.images.alloy.pullPolicy }}
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - {name: http, containerPort: 12345}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.resources.alloy | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
      volumes:
        - name: config
          configMap: {name: alloy-config}
{{- end }}
