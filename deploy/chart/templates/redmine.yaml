apiVersion: v1
kind: Service
metadata:
  name: redmine
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: redmine
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redmine-files
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "portal.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.persistence.redmineFilesSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redmine
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redmine
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redmine
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/secrets: {{ toJson .Values.secrets | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres; do sleep 2; done"]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: support-ticket-portal-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: redmine
          image: "{{ .Values.images.redmine.repository }}:{{ .Values.images.redmine.tag }}"
          imagePullPolicy: {{ .Values.images.redmine.pullPolicy }}
          env:
            - {name: REDMINE_DB_POSTGRES, value: postgres}
            - {name: REDMINE_DB_USER, value: postgres}
            - {name: REDMINE_DB_DATABASE, value: redmine}
            - name: REDMINE_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: support-ticket-portal-secrets, key: POSTGRES_PASSWORD}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef: {name: support-ticket-portal-secrets, key: REDMINE_SECRET_KEY_BASE}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /login, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{ toYaml .Values.resources.redmine | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /usr/src/redmine/files
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: redmine-files
