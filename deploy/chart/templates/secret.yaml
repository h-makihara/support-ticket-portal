apiVersion: v1
kind: Secret
metadata:
  name: support-ticket-portal-secrets
  labels:
    {{- include "portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDMINE_API_KEY: {{ required "secrets.redmineApiKey is required" .Values.secrets.redmineApiKey | quote }}
  REDMINE_SECRET_KEY_BASE: {{ required "secrets.redmineSecretKeyBase is required" .Values.secrets.redmineSecretKeyBase | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  TEST_ADMIN_PASSWORD: {{ if .Values.app.testUsers.enabled }}{{ required "secrets.testAdminPassword is required when test users are enabled" .Values.secrets.testAdminPassword | quote }}{{ else }}""{{ end }}
  TEST_SUPPORT_PASSWORD: {{ if .Values.app.testUsers.enabled }}{{ required "secrets.testSupportPassword is required when test users are enabled" .Values.secrets.testSupportPassword | quote }}{{ else }}""{{ end }}
  TEST_SALES_PASSWORD: {{ if .Values.app.testUsers.enabled }}{{ required "secrets.testSalesPassword is required when test users are enabled" .Values.secrets.testSalesPassword | quote }}{{ else }}""{{ end }}
