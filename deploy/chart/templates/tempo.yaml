{{- if .Values.observability.tempoEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels:
    {{- include "portal.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
    ingester:
      trace_idle_period: 10s
      max_block_duration: 5m
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: grpc, port: 4317}
    - {name: http, port: 3200}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: tempo
          image: "{{ .Values.images.tempo.repository }}:{{ .Values.images.tempo.tag }}"
          imagePullPolicy: {{ .Values.images.tempo.pullPolicy }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - {name: grpc, containerPort: 4317}
            - {name: http, containerPort: 3200}
          resources: {{ toYaml .Values.resources.tempo | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: tempo-config}
        - name: data
          emptyDir: {}
{{- end }}

