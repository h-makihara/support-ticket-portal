# Docker Compose-specific Collector configuration.
# Kubernetes uses deploy/chart/templates/observability.yaml instead.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  filter/backend_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'severity_number < 9 and attributes["ticket.portal.debug_enabled"] != true'
  batch: {}

exporters:
  otlphttp/alloy:
    endpoint: http://alloy:4318

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/backend_logs, batch]
      exporters: [otlphttp/alloy]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/alloy]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/alloy]
