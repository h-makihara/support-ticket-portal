traefik:
  install: false
  bundledIngressClass: traefik-dev
  externalIngressClass: traefik
  serviceType: LoadBalancer

backendIngress:
  enabled: true

images:
  backend: {repository: support-ticket-portal/backend, tag: dev, pullPolicy: Always}
  frontend: {repository: support-ticket-portal/frontend, tag: dev, pullPolicy: Always}
  otelCollector: {repository: otel/opentelemetry-collector-contrib, tag: latest, pullPolicy: Always}
  alloy: {repository: grafana/alloy, tag: latest, pullPolicy: Always}
app:
  sessionCookieSecure: false
  backendEnv: {DEPLOY_ENVIRONMENT: dev}
  testUsers:
    enabled: true
