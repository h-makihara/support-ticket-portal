traefik:
  install: false
  bundledIngressClass: traefik-dev
  externalIngressClass: traefik
  serviceType: LoadBalancer

images:
  backend: {repository: support-ticket-portal/backend, tag: dev, pullPolicy: IfNotPresent}
  frontend: {repository: support-ticket-portal/frontend, tag: dev, pullPolicy: IfNotPresent}
  otelCollector: {repository: otel/opentelemetry-collector-contrib, tag: latest, pullPolicy: Always}
  alloy: {repository: grafana/alloy, tag: latest, pullPolicy: Always}
app:
  enableTestUsers: true
  sessionCookieSecure: false
  backendEnv: {DEPLOY_ENVIRONMENT: dev}
  testUsers:
    admin: {username: dev-admin, email: dev-admin@example.invalid}
    support: {username: dev-support, email: dev-support@example.invalid}
    sales: {username: dev-sales, email: dev-sales@example.invalid}
