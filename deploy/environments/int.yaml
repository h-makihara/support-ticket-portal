traefik:
  install: true
  bundledIngressClass: traefik-int
  externalIngressClass: traefik
  serviceType: LoadBalancer

images:
  backend: {repository: support-ticket-portal/backend, tag: int, pullPolicy: Always}
  frontend: {repository: support-ticket-portal/frontend, tag: int, pullPolicy: Always}
  otelCollector: {repository: otel/opentelemetry-collector-contrib, tag: latest, pullPolicy: Always}
  alloy: {repository: grafana/alloy, tag: latest, pullPolicy: Always}
app:
  sessionCookieSecure: false
  backendEnv: {DEPLOY_ENVIRONMENT: int}
  testUsers:
    enabled: true
