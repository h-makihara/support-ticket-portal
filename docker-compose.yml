services:
  postgres:
    image: postgres:15
    container_name: redmine_pg
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "redmine"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redmine:
    image: redmine:6.1
    container_name: redmine
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_POSTGRES: "postgres"
      REDMINE_DB_USER: "postgres"
      REDMINE_DB_PASSWORD: "postgres"
      REDMINE_DB_DATABASE: "redmine"
      SECRET_KEY_BASE: "${REDMINE_SECRET_KEY_BASE:-local-development-redmine-secret-key-base-change-before-production-2026}"
      REDMINE_API_KEY: "${REDMINE_API_KEY:?Set REDMINE_API_KEY in .env}"
      REDMINE_PROJECT_ID: "${REDMINE_PROJECT_ID:-1}"
      REDMINE_TRACKER_NAME: "問い合わせ"
      REDMINE_LANG: "en"
      ENABLE_TEST_USERS: "${ENABLE_TEST_USERS:-false}"
      TEST_ADMIN_USERNAME: "${TEST_ADMIN_USERNAME:-}"
      TEST_ADMIN_PASSWORD: "${TEST_ADMIN_PASSWORD:-}"
      TEST_ADMIN_EMAIL: "${TEST_ADMIN_EMAIL:-}"
      TEST_SUPPORT_USERNAME: "${TEST_SUPPORT_USERNAME:-}"
      TEST_SUPPORT_PASSWORD: "${TEST_SUPPORT_PASSWORD:-}"
      TEST_SUPPORT_EMAIL: "${TEST_SUPPORT_EMAIL:-}"
      TEST_SALES_USERNAME: "${TEST_SALES_USERNAME:-}"
      TEST_SALES_PASSWORD: "${TEST_SALES_PASSWORD:-}"
      TEST_SALES_EMAIL: "${TEST_SALES_EMAIL:-}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - redmine_data:/usr/src/redmine/files
      - redmine_assets:/usr/src/redmine/public/assets
      - ./scripts/bootstrap_redmine.rb:/usr/src/redmine/bootstrap_redmine.rb:ro
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - 'exit(Net::HTTP.get_response(URI("http://localhost:3000/login")).is_a?(Net::HTTPSuccess) ? 0 : 1)'
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ticket_backend
    ports:
      - "8000:8000"
    environment:
      REDMINE_BASE_URL: "http://redmine:3000"
      REDMINE_API_KEY: "${REDMINE_API_KEY:?Set REDMINE_API_KEY in .env}"
      REDMINE_PROJECT_ID: "${REDMINE_PROJECT_ID:-1}"
      REDMINE_TRACKER_ID: "${REDMINE_TRACKER_ID:-3}"
      REDIS_URL: "redis://redis:6379/0"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      LOG_LEVEL: "DEBUG"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on:
      redmine:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    container_name: ticket_redis
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

  # Docker Compose has no Pod-local network namespace, so Backend uses the
  # collector service name instead of the Kubernetes sidecar's localhost.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ticket_otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/docker/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - alloy

  alloy:
    image: grafana/alloy:latest
    container_name: ticket_alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      EXTERNAL_OTLP_ENDPOINT: "${EXTERNAL_OTLP_ENDPOINT:-http://observability.example.invalid:4318}"
    ports:
      - "12345:12345"
    volumes:
      - ./deploy/docker/alloy.alloy:/etc/alloy/config.alloy:ro

volumes:
  redmine_data:
  redmine_assets:
  pg_data:
