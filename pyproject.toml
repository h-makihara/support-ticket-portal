[project]
name = "support-ticket-portal"
version = "0.4.0"
description = "社内問い合わせチケット管理システム"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "redis>=5.2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b",
    "opentelemetry-instrumentation-httpx>=0.48b",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "coverage>=7.0",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=backend",
    "--cov-report=term-missing",
    "-v",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/__pycache__/*",
]
